[pytest]
testpaths = tests
pythonpath = .
; The default selection excludes the budget suites, so a bare `pytest` run is the
; correctness suite and nothing in it can fail because a laptop was busy. Timing
; and memory bounds are real assertions, not skips, so they are selected
; explicitly: `pytest -m perf` and `pytest -m resource`. A command-line `-m`
; *replaces* the one below rather than intersecting with it -- pytest's `-m` is a
; single-valued option and addopts are prepended, so argparse keeps the last
; occurrence. That is what makes those two invocations select. The corollary is
; that any other explicit `-m` also drops the exclusion: `-m "not slow"` will
; pull the budget suites back in, so write `-m "not slow and not perf and not
; resource"` if that is not what you wanted.
;
; `slow` is deliberately NOT excluded. The tests carrying it are pooled property
; tests whose statistical thresholds only hold over the full corpus, so they are
; part of the default correctness baseline; the marker exists to let a developer
; deselect them ad hoc with `-m "not slow"`.
addopts = -m "not perf and not resource"
markers =
    slow: long-running pooled property tests; part of the default selection, deselect ad hoc with -m "not slow"
    perf: timing and throughput budgets, selected explicitly with -m perf
    resource: memory and resident-set-size budgets, selected explicitly with -m resource
